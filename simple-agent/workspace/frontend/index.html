<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Agent Frontend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f7fafc 100%);
            min-height: 100vh;
        }

        /* ===== Modern Navigation Bar ===== */
        .navbar {
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.35);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: box-shadow 0.3s ease;
        }

        .navbar.scrolled {
            box-shadow: 0 6px 24px rgba(30, 58, 138, 0.5);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            padding: 0 1rem;
        }

        /* 品牌 Logo */
        .nav-logo {
            display: flex;
            align-items: center;
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .nav-logo:hover {
            transform: scale(1.05);
        }

        .nav-logo .logo-dot {
            width: 12px;
            height: 12px;
            background: #93c5fd;
            border-radius: 50%;
            margin-right: 0.5rem;
            box-shadow: 0 0 8px rgba(147, 197, 253, 0.9);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        /* 导航链接 */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 0.3rem;
            align-items: center;
        }

        .nav-links a {
            position: relative;
            display: block;
            padding: 0.55rem 1.15rem;
            color: #dbeafe;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 6px;
            overflow: hidden;
            transition: color 0.3s ease, background 0.3s ease, transform 0.25s ease, box-shadow 0.3s ease;
            isolation: isolate;
        }

        /* 底部滑动指示条 - hover 动画效果 */
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #fbbf24, #ffffff);
            border-radius: 3px;
            transform: translateX(-50%);
            transition: width 0.35s ease;
            z-index: -1;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 70%;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
        }

        /* 光扫过 (shimmer) 效果 */
        .nav-links a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: skewX(-20deg);
            transition: left 0.55s ease;
            z-index: -1;
        }

        .nav-links a:hover::before {
            left: 100%;
        }

        /* 当前激活菜单项 */
        .nav-links a.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.16);
            font-weight: 600;
        }

        /* ===== Mobile 汉堡菜单 ===== */
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 0 10px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.05);
        }

        .menu-toggle span {
            display: block;
            height: 2px;
            width: 100%;
            background: #ffffff;
            border-radius: 2px;
            transition: transform 0.4s ease, opacity 0.3s ease, width 0.3s ease;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
            width: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .nav-container {
                height: 58px;
            }

            .menu-toggle {
                display: flex;
            }

            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                flex-direction: column;
                align-items: stretch;
                background: linear-gradient(180deg, #1e3a8a 0%, #2563eb 100%);
                gap: 0;
                padding: 0.5rem 1rem 0.9rem;
                box-shadow: 0 12px 20px rgba(30, 58, 138, 0.35);
                opacity: 0;
                transform: translateY(-12px);
                visibility: hidden;
                transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s;
            }

            .nav-links.open {
                opacity: 1;
                transform: translateY(0);
                visibility: visible;
            }

            .nav-links li a {
                text-align: center;
                margin-top: 0.2rem;
            }

            .nav-links a:hover,
            .nav-links a.active {
                background: rgba(255, 255, 255, 0.16);
            }
        }

        /* ===== Page Content ===== */
        .content {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 1rem;
        }

        .container {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
            border: 1px solid #e5edff;
            line-height: 1.8;
            color: #475569;
        }
    </style>
</head>
<body>
    <!-- 现代导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">
                <span class="logo-dot"></span>
                Logo
            </a>

            <!-- 汉堡按钮（移动端） -->
            <button class="menu-toggle" id="menuToggle" aria-label="菜单">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a href="#home" class="active" data-target="home">首页</a></li>
                <li><a href="#about" data-target="about">关于</a></li>
                <li><a href="#contact" data-target="contact">联系</a></li>
            </ul>
        </div>
    </nav>

    <!-- 页面内容 -->
    <main class="content" id="home">
        <h1>首页</h1>
        <div class="container" id="about">
            <h2 style="color:#1e40af; margin-bottom: 0.5rem;">关于</h2>
            <p>This page can be edited by the AI agent.</p>
            <p>Submit a task to modify this page.</p>
        </div>
        <div class="container" id="contact" style="margin-top: 20px;">
            <h2 style="color:#1e40af; margin-bottom: 0.5rem;">联系</h2>
            <p>联系我们：Mini Agent Team &copy; 2025</p>
        </div>
    </main>

    <script>
        // ===== 滚动时给导航栏加深阴影 =====
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // ===== 移动端汉堡菜单 =====
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('open');
            menuToggle.classList.toggle('active');
        });

        // 点击菜单项后关闭移动端菜单
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('open');
                menuToggle.classList.remove('active');
                setActive(link);
            });
        });

        // ===== 根据滚动位置高亮当前章节对应的菜单项 =====
        function setActive(currentLink) {
            navLinks.querySelectorAll('a').forEach(a => a.classList.remove('active'));
            currentLink.classList.add('active');
        }

        // 使用 IntersectionObserver 依据滚动区域自动切换 active
        const sections = ['home', 'about', 'contact'];
        if ('IntersectionObserver' in window) {
            const nav = document.querySelectorAll('.nav-links a');
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        nav.forEach(a => {
                            a.classList.toggle('active', a.dataset.target === entry.target.id);
                        });
                    }
                });
            }, { rootMargin: '0px 0px -60% 0px' });

            sections.forEach(id => {
                const el = document.getElementById(id);
                if (el) observer.observe(el);
            });
        }
    </script>
</body>
</html>
